server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: pos-backend
  profiles:
    active: dev

# Springdoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
