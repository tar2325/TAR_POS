spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: pos_user
    password: pos_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # DEV ONLY - override with env var APP_JWT_SECRET in production (>= 32 chars)
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-minutes: 480

logging:
  level:
    com.pos.backend: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
