spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${INTERNAL_DATABASE_URL:${DATABASE_URL:${POSTGRES_URL:}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${POSTGRES_USER:}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${APP_JWT_SECRET:pos-default-cloud-secret-testing-min-256-bits-super-safe-key-123}
    access-minutes: 480

server:
  port: ${PORT:8080}

logging:
  level:
    com.pos.backend: INFO
    org.springframework.web: WARN
