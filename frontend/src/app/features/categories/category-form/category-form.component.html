<app-page-header [title]="pageTitle()" [breadcrumbs]="breadcrumbs()" />
<div class="page-content">
  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">
      <mat-form-field appearance="outline" class="full">
        <mat-label>ชื่อหมวดหมู่</mat-label>
        <input matInput formControlName="name" placeholder="เช่น เครื่องดื่ม" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>ไอคอน</mat-label>
        <mat-select formControlName="icon">
          @for (option of iconOptions; track option.value) {
            <mat-option [value]="option.value">
              <span class="icon-option">
                <mat-icon>{{ option.value }}</mat-icon>
                {{ option.label }}
              </span>
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>ลำดับแสดงผล</mat-label>
        <input matInput type="number" formControlName="sortOrder" min="1" />
      </mat-form-field>

      <mat-checkbox formControlName="active">เปิดใช้งานในหน้าขาย</mat-checkbox>
    </div>

    <div class="form-actions">
      <a mat-stroked-button routerLink="/categories">ยกเลิก</a>
      <button mat-flat-button color="primary" type="submit">บันทึก</button>
    </div>
  </form>
</div>
